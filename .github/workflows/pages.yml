name: Pages

# Publikuje stronę z folderu web/ na GitHub Pages. Wymaga: Settings → Pages → Source: „GitHub Actions”.
# Adres projektu Supabase i klucz publiczny trafiają do web/assets/config.js z sekretów TRACKO_CLOUD_URL / TRACKO_CLOUD_ANON_KEY
# (te same, co w buildzie aplikacji). Bez nich strona działa w trybie demonstracyjnym z danymi przykładowymi.
on:
  push:
    branches: [main, master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js
        env:
          CLOUD_URL: ${{ secrets.TRACKO_CLOUD_URL }}
          CLOUD_KEY: ${{ secrets.TRACKO_CLOUD_ANON_KEY }}
          CARTO_KEY: ${{ secrets.TRACKO_CARTO_KEY }}
          TILE_LIGHT: ${{ secrets.TRACKO_TILE_URL }}
          TILE_DARK: ${{ secrets.TRACKO_TILE_URL_DARK }}
          TILE_ATTR: ${{ secrets.TRACKO_TILE_ATTR }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "url": os.environ.get("CLOUD_URL", "").strip().rstrip("/"),
              "key": os.environ.get("CLOUD_KEY", "").strip(),
              "releasesUrl": "https://github.com/%s/releases/latest" % os.environ["REPO"],
              "repoUrl": "https://github.com/%s" % os.environ["REPO"],
          }
          # opcjonalne ustawienia mapy – tylko jeśli sekrety są ustawione
          for name, env in (("cartoKey", "CARTO_KEY"), ("tileLight", "TILE_LIGHT"), ("tileDark", "TILE_DARK"), ("tileAttr", "TILE_ATTR")):
              v = os.environ.get(env, "").strip()
              if v:
                  cfg[name] = v
          # bezpiecznik: do publicznej strony nie wolno wstawić klucza serwisowego
          import base64
          key = cfg["key"]
          bad = key.startswith("sb_secret_")
          if key.count(".") == 2:
              try:
                  payload = key.split(".")[1]; payload += "=" * (-len(payload) % 4)
                  bad = bad or json.loads(base64.urlsafe_b64decode(payload)).get("role") == "service_role"
              except Exception:
                  pass
          if bad:
              raise SystemExit("::error::TRACKO_CLOUD_ANON_KEY wygląda na klucz serwisowy (service_role/secret) – NIE publikuję strony")
          with open("web/assets/config.js", "w") as f:
              f.write("window.TRACKO_CONFIG = " + json.dumps(cfg) + ";\n")
          print("config.js: tryb", "produkcyjny" if cfg["url"] and cfg["key"] else "demonstracyjny (brak sekretów)")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
